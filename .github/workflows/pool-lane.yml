# GENERATED by tooling/ops/gen-pool-shell.mjs from tooling/ci/ci-pools.json and each class's home job. Never edit:
# the shell's main CI regenerates it and pushes it to every listed pool (tooling/ops/pool-sync.mjs).
name: pool lane
run-name: pool ${{ inputs.sha }} parent ${{ inputs.parent_run }} attempt ${{ inputs.parent_attempt }} lane ${{ inputs.lane }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: the private head the parent shell run is for (the bridge binds the checkout token to it)
        required: true
        type: string
      checkout_sha:
        description: the commit the home job builds (the PR merge commit, or the sha)
        required: true
        type: string
      parent_run:
        required: true
        type: string
      parent_attempt:
        required: true
        type: string
      lane:
        required: true
        type: choice
        options:
          - guard-shards
          - guard-singles
      job:
        description: the home job this child runs (of its class)
        required: true
        type: choice
        options:
          - guard-tests
          - guard-meta
          - guards-legal
          - guards-store
          - guards-chassis
      identity:
        description: the parent run's {event, ref, base_sha, base_ref, pr}, as JSON (the shell prelude's NIKATRU_* identity)
        required: true
        type: string
      shard:
        required: false
        type: string
        default: ''
permissions: {}
jobs:
  guard-shards--guard-tests:
    # generated from lane-guards.yml job guard-tests: its steps after its checkout, verbatim but for matrix.shard → inputs.shard,
    # quiet-step around every run, and no artifact step (a pool repository is public).
    if: inputs.lane == 'guard-shards' && inputs.job == 'guard-tests'
    name: guard-shards · guard-tests (shard ${{ inputs.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The inputs are what the parent sends
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
          IN_PARENT_RUN: ${{ inputs.parent_run }}
          IN_PARENT_ATTEMPT: ${{ inputs.parent_attempt }}
          IN_LANE: ${{ inputs.lane }}
          IN_JOB: ${{ inputs.job }}
          IN_SHARD: ${{ inputs.shard }}
          IN_IDENTITY: ${{ inputs.identity }}
        run: |
          set -euo pipefail
          [[ "$IN_SHA" =~ ^[0-9a-f]{40}$ && "$IN_CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha and checkout_sha must be 40-hex"; exit 1; }
          [[ "$IN_PARENT_RUN" =~ ^[1-9][0-9]{0,19}$ && "$IN_PARENT_ATTEMPT" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "::error::parent_run and parent_attempt must be positive integers"; exit 1; }
          [[ "$IN_SHARD" =~ ^([1-9][0-9]?)?$ ]] || { echo "::error::shard must be empty or a small positive integer"; exit 1; }
          jq -e 'type == "object" and ((keys - ["event","ref","base_sha","base_ref","pr"]) | length == 0) and ((.event // "") | test("^[a-z_]{0,32}$")) and ((.ref // "") | test("^(refs/(heads|tags|pull)/[A-Za-z0-9._/-]{1,200})?$")) and ((.base_sha // "") | test("^([0-9a-f]{40})?$")) and ((.base_ref // "") | test("^[A-Za-z0-9._/-]{0,200}$")) and ((.pr // "") | tostring | test("^([1-9][0-9]{0,9})?$"))' <<<"$IN_IDENTITY" >/dev/null || { echo "::error::identity is not the parent's {event, ref, base_sha, base_ref, pr}"; exit 1; }
      - name: A read-only token for the private code (the bridge's POST /pool-checkout)
        id: pool-checkout
        env:
          IN_SHA: ${{ inputs.sha }}
          BRIDGE: https://gh-bridge.nikatru.workers.dev
        run: |
          set -euo pipefail
          oidc=$(curl -fsS --retry 3 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nikatru-gh-bridge-propose" | jq -r .value)
          echo "::add-mask::$oidc"
          answer=$(curl -fsS --retry 3 -X POST -H "content-type: application/json" -H "x-bridge-oidc: $oidc" --data "{\"sha\":\"$IN_SHA\"}" "$BRIDGE/pool-checkout")
          token=$(jq -r .token <<<"$answer")
          [[ -n "$token" && "$token" != null ]] || { echo "::error::the bridge returned no token"; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nikatru-com/Nikatru_Private
          ref: ${{ inputs.checkout_sha }}
          token: ${{ steps.pool-checkout.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check out private main's step wrapper and composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nikatru-com/Nikatru_Private
          ref: main
          path: .pool-trusted
          sparse-checkout: |
            tooling/ci
            .github/actions
          token: ${{ steps.pool-checkout.outputs.token }}
          persist-credentials: false
      - name: Keep private main's copies out of the checked-out tree
        run: printf '/.pool-trusted/\n' >> "$(git rev-parse --git-path info/exclude)"
      - name: Name the private commit (the shell prelude's identity, from the parent run)
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_IDENTITY: ${{ inputs.identity }}
          IN_REPO: nikatru-com/Nikatru_Private
        run: |
          set -euo pipefail
          {
            echo "NIKATRU_SHA=$(git rev-parse HEAD)"
            echo "NIKATRU_HEAD_SHA=$IN_SHA"
            echo "NIKATRU_EVENT_NAME=$(jq -r '.event // ""' <<<"$IN_IDENTITY")"
            ref=$(jq -r '.ref // ""' <<<"$IN_IDENTITY"); echo "NIKATRU_REF=$ref"; echo "NIKATRU_REF_NAME=${ref#refs/*/}"
            echo "NIKATRU_BASE_SHA=$(jq -r '.base_sha // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_BASE_REF=$(jq -r '.base_ref // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_PR=$(jq -r '.pr // ""' <<<"$IN_IDENTITY")"
            echo "NIKATRU_PRIVATE_REPO=$IN_REPO"
          } >> "$GITHUB_ENV"
      - uses: ./.pool-trusted/.github/actions/setup-node
      - name: The guards must be able to fail
        shell: node .pool-trusted/tooling/ci/quiet-step.mjs --name "The guards must be able to fail" --default-shell {0}
        env:
          GITHUB_TOKEN: ${{ '' }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/guard-tests"
          node tooling/ci/guard-test-shards.mjs --plan --shards 4 --shard ${{ inputs.shard }} --out "${{ runner.temp }}/guard-tests/files.txt" > /dev/null
          node --import "$SPAWN_CEILING" --test-timeout=600000 --test --test-reporter=spec  --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="${{ runner.temp }}/guard-tests/guard-tests.junit.xml" $(cat "${{ runner.temp }}/guard-tests/files.txt")
